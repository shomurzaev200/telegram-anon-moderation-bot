{% extends 'base.html' %}{% block content %}<h1>Пользователи</h1><form method="get" class="actions"><input name="q" value="{{ q }}" placeholder="Telegram ID"><button>Найти</button><a href="/users">Сбросить</a></form>{% for u in rows %}<section class="card actions"><strong>{{ u.id }}</strong><span>{{ 'Заблокирован' if u.blocked else 'Активен' }}</span><span>{{ u.created|date }}</span><form method="post" action="/users/{{ u.id }}/toggle"><input type="hidden" name="csrf" value="{{ csrf }}"><button class="secondary">{{ 'Разблокировать' if u.blocked else 'Заблокировать' }}</button></form></section>{% else %}<p>Пользователей нет.</p>{% endfor %}{% if page>1 %}<a href="?page={{ page-1 }}">← Назад</a>{% endif %}{% if more %}<a href="?page={{ page+1 }}">Далее →</a>{% endif %}{% endblock %}
